name: github pages

on:
  push:
    branches:
      - main  # Set a branch to deploy
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Hugo
        id: setup-hugo
        uses: peaceiris/actions-hugo@v2
        continue-on-error: true
        with:
          hugo-version: '0.97.3'
          extended: true

      - name: Build pinned Hugo when the release download fails
        if: steps.setup-hugo.outcome == 'failure'
        env:
          CGO_ENABLED: '1'
          GOBIN: ${{ runner.temp }}/hugo-bin
        run: |
          go install -tags extended github.com/gohugoio/hugo@v0.97.3
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Build
        run: hugo --gc --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
